[project]
name = "aggregator-bootstrap"
version = "0.1.0"
description = "Browser-side worker that captures aggregator sessions and pushes them to the mm-ecommerce API."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.52",
    "httpx>=0.28",
    "typer>=0.12",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
aggregator-bootstrap = "aggregator_bootstrap.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
