[project]
name = "aggregator-bootstrap"
version = "0.1.0"
description = "Browser-side worker that captures aggregator sessions and pushes them to the mm-ecommerce API."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.52",
    "httpx>=0.28",
    "typer>=0.12",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
aggregator-bootstrap = "aggregator_bootstrap.cli:app"

[tool.ruff.lint]
# Match apps/api's effective ruleset exactly, and pin it explicitly rather than
# relying on ruff's default `select`: apps/api caps ruff at <0.16 (default E4/E7/
# E9,F) while this package floated to 0.16, whose default is far broader
# (S/BLE/RUF/UP/SIM…) — so the same code linted clean there and failed here. An
# explicit select is version-independent. `I` (isort) matches apps/api.
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
