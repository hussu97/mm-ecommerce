[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# Every entry here is a third-party or test-environment artifact, not a bug in
# our code — each is pinned narrowly (by message + category) so a NEW warning
# still surfaces. Keep this list honest: only silence what you have traced to a
# library or the harness.
filterwarnings =
    ignore::DeprecationWarning:slowapi
    # Starlette's TestClient warns that its httpx integration is deprecated
    # ("install httpx2"). It fires merely on importing fastapi.testclient
    # (tests/unit/test_error_wire_shape.py); everything else uses AsyncClient.
    # A library-version deprecation we cannot fix without changing the httpx dep.
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
    # google.auth notices when a developer's LOCAL gcloud user credentials carry
    # no quota project (app/core/object_storage.py imports google.cloud.storage).
    # CI authenticates with a service account and never sees this — a local-only
    # environment notice, not a code issue.
    ignore:Your application has authenticated using end user credentials.*:UserWarning
    # asyncpg schedules Connection._cancel when a real-DB connection is torn down
    # mid-query during integration-test teardown; the loop is already closing so
    # it is never awaited. A harness teardown artifact of the real-DB tests.
    ignore:coroutine 'Connection\._cancel' was never awaited:RuntimeWarning
    # Unclosed sockets to the local Postgres from the real-DB integration tests —
    # the connections are dropped at teardown rather than explicitly closed.
    # Python's default filters already hide ResourceWarning; this keeps `-W
    # default` / dev-mode runs clean too. Test-only; production closes its pool.
    ignore::ResourceWarning
    # The same asyncpg `_cancel` teardown race as above, but surfaced by the GC
    # at interpreter shutdown as an "unraisable exception" (a KeyError from the
    # finalizing interpreter) rather than the plain RuntimeWarning. Same harness
    # artifact of the real-DB tests, a different warning class — pinned to the
    # `Connection._cancel` coroutine so an unrelated unraisable still surfaces.
    ignore:.*<coroutine object Connection\._cancel.*:pytest.PytestUnraisableExceptionWarning
    # Starlette's TestClient imports `anyio.abc.BlockingPortal`, whose alias anyio
    # now deprecates. Fires on importing starlette.testclient; a library-version
    # deprecation we cannot fix without changing the anyio/starlette dep.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning
    # WeasyPrint (menu-PDF render) warns that a future version will require
    # HarfBuzz-Subset. A third-party forward-compatibility notice, not our code.
    ignore:HarfBuzz-Subset will be required by future versions of WeasyPrint.*:DeprecationWarning
