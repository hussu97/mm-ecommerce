[project]
name = "mm-api"
version = "0.1.0"
description = "Melting Moments Cakes - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.20",
    "httpx[http2]>=0.28.0",
    "stripe>=11.0.0",
    "resend>=2.0.0",
    "boto3>=1.35.0",
    "jinja2>=3.1.0",
    # Writes the stylesheet onto the elements before an email is sent
    # (app/services/email_service.py). A mail client that renders a preview
    # drops <head> and with it every rule, which is how the same message came
    # out designed when opened and naked in a notification.
    "css-inline>=0.17.0",
    "python-dateutil>=2.9.0",
    "slowapi>=0.1.9",
    "redis[asyncio]>=5.0.0",
    "python-json-logger>=3.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "webauthn>=2.5.0",
    # Re-encodes admin image uploads before they reach R2 (app/core/images.py).
    "pillow>=11.0.0",
    # Validates phone numbers server-side (app/core/phone.py). The Python port
    # of Google's libphonenumber, carrying the same metadata the storefront's
    # `PhoneInput` already runs — so the untrusted side of the wire stops being
    # the lenient one. Phone is the promo-abuse identity; "eight or more
    # digits", which is what the hand-rolled check amounted to, was not a check.
    "phonenumbers>=9.0.0",
    "openpyxl>=3.1.5",
    "curl-cffi>=0.16.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # For local use: `pytest -n auto --dist loadfile` roughly halves the suite
    # on a machine with cores to spare (9.6s -> 5.6s). CI runs it serially —
    # there it measured slightly *slower*, because the cost is importing the
    # app rather than running the tests, and each worker pays that separately.
    #
    # Use `--dist loadfile` when you do run it in parallel. It keeps every test
    # in a file on one worker, so the three modules that talk to a real
    # database cannot interleave with themselves. Across files they are already
    # safe — each cleans up only its own prefix (`pytest-pricesort`,
    # `pytest-custom-`, and MenuGroup rows).
    "pytest-xdist>=3.6.0",
    "httpx>=0.28.0",
    # Reads docker-compose.prod.yml, so the tests can check that a setting
    # which gates behaviour actually reaches the container that enforces it.
    "pyyaml>=6.0",
    # Pinned to a minor range. Ruff was previously unpinned, so a release that
    # widened the default ruleset turned CI red across the whole package without
    # a single line of source changing. Bump this deliberately, not by accident.
    "ruff>=0.15.13,<0.16",
]

#: Only `scripts/build_delivery_zones.py` needs these, and only when the
#: delivery map is redrawn — which is rare and deliberate. Kept out of `dev` so
#: CI and a normal setup do not pull a GEOS-backed wheel they will never call:
#: the generated geometry is committed, and everything downstream reads that.
#:
#:     pip install -e ".[geo]"
geo = [
    "shapely>=2.0",
]

[tool.ruff]
# Ruff ran on its defaults until now — `E4`, `E7`, `E9`, `F` — which is why
# `models/address.py` could carry a second `from sqlalchemy import ...` below a
# local import and pass CI for months.

[tool.ruff.lint]
# `I` (isort) is the addition. It is mechanical, it has an autofix, and import
# order is one of the few things in a file an agent reads before anything else.
extend-select = ["I"]

# Deliberately *not* enabled, so the next person does not have to re-derive it:
#
# * `B`, `UP` — 1,822 findings, almost all cosmetic modernisation
#   (`Optional[X]` -> `X | None`, `timezone.utc` -> `UTC`). Worth doing as its
#   own pass with its own review; folding it into an unrelated change would
#   bury the change.
# * `S` (bandit) — 7 findings in `app/`, all false positives: `token_type =
#   "bearer"`, the dev sentinel `SECRET_KEY` that `app_setup` already refuses to
#   boot production with, and Cloudflare's published Turnstile test keys. Seven
#   suppressions for no finding is worse than not running it. Note the
#   `# noqa: S608` comments in migrations 054 and 061 are therefore inert — they
#   document deliberately string-built SQL and are kept for that.

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
