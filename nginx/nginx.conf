user  nginx;
worker_processes 1;  # e2-small, this nginx only proxies api+pos

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # One worker on an e2-small, so this is the whole box's concurrent-connection
    # ceiling. 1024 was low enough that a burst of keepalive'd browser
    # connections plus a Vercel build's fan-out could sit near it; 4096 is still
    # a few MB of state and leaves headroom before nginx starts refusing accepts.
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Upstreams, with a connection pool ─────────────────────────────────────
    #
    # Bind-mounted from nginx/runtime/upstreams.conf so a deploy can retarget
    # `api` ↔ `api-green` (and the POS pair) with `nginx -s reload` instead of
    # rebuilding this container. `proxy_pass http://api:8000` opened a new TCP
    # connection per request; keepalive holds them open. It only works together
    # with the `Connection` header below — see there.
    include /etc/nginx/runtime/upstreams.conf;

    # Rate limiting zones
    #
    # The key is the client IP, which is the right key for a browser and the
    # wrong one for the storefront: every server-rendered page comes from a
    # small pool of Vercel egress addresses, so all of it shares one bucket.
    #
    # 10r/s with a burst of 20 was shaping normal traffic rather than stopping
    # abuse, and it was measured doing it: 40 concurrent requests to
    # `/i18n/translations/en` from one address returned **19 × 503**. A Vercel
    # build is exactly that shape — `generateStaticParams` prerenders the
    # catalogue across ten workers, so ~80 unique reads land in a couple of
    # seconds from one address. A local build against the live API failed on it.
    #
    # 50r/s with a burst of 200 is sized for that and is not generous in any
    # way that matters: these are Redis-backed reads that answer in about 3 ms,
    # so 50 of them a second is roughly 15% of one core. The limiter is here to
    # stop something pathological, not to meter a deploy.
    #
    # The proper fix is to stop keying shop traffic on an address that is not
    # the shopper's — a shared header from the storefront, or an allow-list —
    # and is left for when there is a secret to key it on.
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=50r/s;
    limit_req_zone  $binary_remote_addr  zone=web_limit:10m  rate=30r/s;
    # A shop counter is one IP running one or more terminals, each firing a
    # request per line, modifier and payment. Rate-limiting it like a browser
    # would throttle a queue at the till.
    limit_req_zone  $binary_remote_addr  zone=pos_limit:10m  rate=50r/s;
    # Device pairing redeems a short one-time code (`POST /api/v1/devices/pair`).
    # A terminal pairs rarely, so 6/min per IP is generous for real use and turns
    # brute-forcing the code space into a multi-year exercise. Applied on a tight
    # `location =` for that one path (see pos.conf / ssl.conf); everything else on
    # the host keeps the wide pos_limit/api_limit above.
    limit_req_zone  $binary_remote_addr  zone=pair_limit:10m  rate=6r/m;

    # A throttled request is 429 (Too Many Requests), not nginx's default 503.
    # 503 reads as "the service is down" — it is indistinguishable from a real
    # outage in logs and to a client's retry logic — whereas 429 says exactly
    # what happened and is the status a well-behaved client backs off on.
    limit_req_status 429;

    # Concurrent-connection cap, keyed by client IP. It is declared here but
    # applied ONLY on the register (pos.conf), where one IP is one counter. The
    # storefront API is deliberately left off it: its callers are a small pool
    # of shared Vercel egress addresses, and a build's fan-out opens many
    # connections at once from one of them — a per-IP connection cap there would
    # reject a build the same way the old rate limit did (see api_limit above).
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # ── Connection header, per request rather than globally ───────────────────
    #
    # This was a flat `Connection: upgrade` on every proxied request. That
    # header is meant for the WebSocket handshake and nothing else, and sending
    # it always tells the upstream to tear the connection down after the
    # response — which silently defeats `keepalive` above and cost a fresh TCP
    # connection to uvicorn on every single API call.
    #
    # The map is the canonical fix: a request that is really upgrading keeps
    # `upgrade`, everything else sends an empty header, which is what lets a
    # connection be reused.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Proxy settings
    proxy_http_version      1.1;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection $connection_upgrade;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_cache_bypass      $http_upgrade;
    proxy_read_timeout      60s;
    proxy_connect_timeout   10s;

    include /etc/nginx/conf.d/*.conf;
}
