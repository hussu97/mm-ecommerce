# ── Register API — pos.meltingmomentscakes.com ────────────────────────────────
#
# Copied into conf.d by the entrypoint only once a certificate exists for this
# hostname. nginx reads certificate files at startup and refuses to start if
# one is missing, so shipping this unconditionally would take the storefront
# API down with it on any VM where the POS certificate has not been issued yet.
#
# The terminal talks here and nowhere else; api.meltingmomentscakes.com refuses
# device tokens outright.
server {
    listen 443 ssl;
    # A till fires a request per line, modifier and payment; multiplexing them
    # over one connection is worth more here than anywhere else on the VM.
    http2 on;
    server_name pos.meltingmomentscakes.com;

    ssl_certificate     /etc/letsencrypt/live/pos.meltingmomentscakes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.meltingmomentscakes.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # A busy counter fires far more requests per terminal than a browser does —
    # every line added, every modifier, every payment — so the burst is wider
    # than the storefront's. A till that gets a 503 mid-sale is a worse outcome
    # than a slow one.
    limit_req zone=pos_limit burst=60 nodelay;

    # One IP here is one shop counter with a handful of terminals, each holding a
    # few multiplexed HTTP/2 connections. 40 concurrent is far above that and far
    # below what a single host running a socket-exhaustion attack would open, so
    # it is a ceiling on abuse that a real counter never approaches. (The
    # storefront API is left off this — see limit_conn_zone in nginx.conf.)
    limit_conn perip 40;

    client_max_body_size 10M;

    # Close secret-file probes with no response; never matches /.well-known, so
    # the ACME challenge is untouched. See the note in ssl.conf.
    location ~ /\.(env|git) {
        return 444;
    }

    # Device pairing redeems a one-time code; rate-limit that one path hard so
    # the code cannot be brute-forced, while the till's normal per-line traffic
    # keeps the wide pos_limit burst above.
    location = /api/v1/devices/pair {
        limit_req zone=pair_limit burst=3 nodelay;
        proxy_pass http://pos_backend;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://pos_backend;
        proxy_read_timeout 120s;
    }
}
