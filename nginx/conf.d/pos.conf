# ── Register API — pos.meltingmomentscakes.com ────────────────────────────────
#
# Copied into conf.d by the entrypoint only once a certificate exists for this
# hostname. nginx reads certificate files at startup and refuses to start if
# one is missing, so shipping this unconditionally would take the storefront
# API down with it on any VM where the POS certificate has not been issued yet.
#
# The terminal talks here and nowhere else; api.meltingmomentscakes.com refuses
# device tokens outright.
server {
    listen 443 ssl;
    # A till fires a request per line, modifier and payment; multiplexing them
    # over one connection is worth more here than anywhere else on the VM.
    http2 on;
    server_name pos.meltingmomentscakes.com;

    ssl_certificate     /etc/letsencrypt/live/pos.meltingmomentscakes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.meltingmomentscakes.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # A busy counter fires far more requests per terminal than a browser does —
    # every line added, every modifier, every payment — so the burst is wider
    # than the storefront's. A till that gets a 503 mid-sale is a worse outcome
    # than a slow one.
    limit_req zone=pos_limit burst=60 nodelay;

    client_max_body_size 10M;

    location / {
        proxy_pass http://pos_backend;
        proxy_read_timeout 120s;
    }
}
