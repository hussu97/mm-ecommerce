# ── HTTP: redirect to HTTPS + certbot challenge (api only) ───────────────────
# Note: meltingmomentscakes.com and admin.meltingmomentscakes.com are on Vercel.
# This VM only serves API hosts. (The legacy aggregator API/dashboard was
# decommissioned when aggregator ingestion moved into mm-ecommerce.)
server {
    listen 80;
    server_name api.meltingmomentscakes.com pos.meltingmomentscakes.com;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API ────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    # HTTP/1.1 meant every concurrent call from a render opened its own
    # connection and its own TLS handshake. nginx 1.25 replaced the
    # `listen ... http2` form with this directive.
    http2 on;
    server_name api.meltingmomentscakes.com;

    ssl_certificate     /etc/letsencrypt/live/api.meltingmomentscakes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.meltingmomentscakes.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-Frame-Options           "DENY"                 always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # See `api_limit` in nginx.conf for why the burst is what it is: a deploy
    # prerenders the catalogue from one Vercel address in a few seconds.
    limit_req zone=api_limit burst=200 nodelay;

    # Increase body size for file uploads
    client_max_body_size 10M;

    location / {
        proxy_pass http://api_backend;
        proxy_read_timeout 120s;
    }
}
