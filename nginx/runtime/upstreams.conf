# Live API/POS upstreams. The committed default points at slot A (`api` /
# `pos-api`). `scripts/cutover-backend.sh` rewrites this file to the idle slot
# and reloads nginx; keep keepalive_timeout in sync with DRAIN_SECONDS there.
upstream api_backend {
    server api:8000;
    keepalive 32;
    keepalive_timeout 5s;
    keepalive_requests 1000;
}

upstream pos_backend {
    server pos-api:8000;
    keepalive 32;
    keepalive_timeout 5s;
    keepalive_requests 1000;
}
