name: Date drift

# Runs the full API suite with the clock moved 90 days forward. A test whose
# fixture hard-codes a date that only works while it is "recent" (inside a
# lookback window, before an expiry) fails here ~3 months before it would turn
# the deploy gate red. That happened on 2026-10-06: the aggregator poison-order
# test's 2026-09-06 business date left promote's 30-day window and blocked a
# production deploy. A red run here means: derive that fixture's date from
# today, don't bump the literal. See MM_TEST_SHIFT_DAYS in tests/conftest.py.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      shift_days:
        description: Days to move the clock forward
        default: "90"

permissions:
  contents: read

jobs:
  pytest-shifted:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mm
          POSTGRES_PASSWORD: mm
          POSTGRES_DB: mm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mm:mm@localhost:5432/mm_test
      DATABASE_URL: postgresql+asyncpg://mm:mm@localhost:5432/mm_test
      MM_TEST_SHIFT_DAYS: ${{ inputs.shift_days || '90' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          cd apps/api
          # From uv.lock, like the production image (Dockerfile F-OPS-17) — not a
          # fresh resolve. A fresh resolve tested a stack prod never runs: pydantic
          # 2.14 (2026-10) changed the OpenAPI output and failed the types gate
          # while the image still shipped 2.13; SQLAlchemy 2.1 did the same before.
          uv export --locked --extra dev --no-emit-project --no-hashes -o /tmp/requirements.lock.txt
          uv pip install --system -r /tmp/requirements.lock.txt
          uv pip install --system --no-deps -e .

      - name: Prepare the test database
        # Migrations run on the real clock; only the tests are shifted.
        env:
          MM_TEST_SHIFT_DAYS: ""
        run: |
          cd apps/api
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      - name: Run pytest (clock +${{ env.MM_TEST_SHIFT_DAYS }} days)
        run: |
          cd apps/api
          pytest tests/ --tb=short
