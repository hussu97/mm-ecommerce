name: PR Check

on:
  pull_request:
    branches: [main]

# Pushing twice to a branch used to leave the first run checking a commit
# nobody was going to merge, all the way to the end. Only the newest commit on
# a branch is worth the minutes.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            api:
              - 'apps/api/**'
              - 'nginx/**'
              - 'docker-compose*.yml'

  lint-web:
    name: Lint, Test & Build (Web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx', 'apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-web-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm --filter web test

      - name: Type-check
        run: pnpm --filter web exec tsc --noEmit

      - name: Build
        run: pnpm --filter web build

  lint-admin:
    name: Lint, Test & Build (Admin)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/admin/.next/cache
          key: nextjs-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/admin/src/**/*.ts', 'apps/admin/src/**/*.tsx', 'apps/admin/**/*.ts', 'apps/admin/**/*.tsx') }}
          restore-keys: |
            nextjs-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-admin-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter admin lint

      - name: Test
        run: pnpm --filter admin test

      - name: Type-check
        run: pnpm --filter admin exec tsc --noEmit

      - name: Build
        run: pnpm --filter admin build

  lint-python:
    name: Lint & Test (Python)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `pip install -e ".[dev]"` took 19s of this job's 74s. uv resolves and
      # installs the same set in a couple of seconds, and caches the wheels
      # itself — so `cache: pip` on setup-python above is no longer needed.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/pyproject.toml

      - name: Cache ruff
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('apps/api/pyproject.toml') }}

      - name: Cache pytest
        uses: actions/cache@v4
        with:
          path: apps/api/.pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: pytest-${{ runner.os }}-

      - name: Install dependencies
        run: |
          cd apps/api
          uv pip install --system -e ".[dev]"

      - name: Ruff check
        run: |
          cd apps/api
          ruff check .
        env:
          RUFF_CACHE_DIR: ~/.cache/ruff

      - name: Ruff format check
        run: |
          cd apps/api
          ruff format --check .
        env:
          RUFF_CACHE_DIR: ~/.cache/ruff

      # Serial on purpose — see the note in deploy.yml. xdist measured slower
      # here (50s vs 47s): the cost is importing the app, and each worker pays
      # it again. `-v` is gone; it printed 1280 lines nobody reads.
      - name: Run pytest
        run: |
          cd apps/api
          pytest tests/ --tb=short --cov=app --cov-report=term-missing
