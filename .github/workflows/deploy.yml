name: Deploy to Production

on:
  push:
    branches: [main]
  # For redeploying without a code change — which is what changing a secret
  # needs. The `.env` on the VM is written by this workflow, and Vercel bakes
  # its public variables at build time, so a secret set in either place does
  # nothing until something deploys again.
  workflow_dispatch:

# One deploy at a time. Deliberately NOT cancel-in-progress: this job runs
# migrations and restarts containers on the VM, and killing it partway through
# either of those is how you get a half-migrated database with no job left
# alive to finish the job. Queue instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect -changed paths
    runs-on: ubuntu-latest
    outputs:
      # A manual run has no previous commit to diff against, so the filter
      # would find nothing changed and deploy nothing at all — which is the
      # opposite of what someone pressing "Run workflow" is asking for.
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
      admin: ${{ steps.filter.outputs.admin == 'true' || github.event_name == 'workflow_dispatch' }}
      api: ${{ steps.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
      # The Playwright bootstrap image is ~4.7GB and rarely changes. Gate its
      # rebuild+push+pull on its own sources so a routine API deploy never
      # rebuilds or re-pulls it — that churn is what filled the 20GB VM disk.
      bootstrap: ${{ steps.filter.outputs.bootstrap == 'true' || github.event_name == 'workflow_dispatch' }}
      # nginx's config is baked into its image. Rebuilding it drops TLS on
      # 80/443 while the container is replaced, so a routine API deploy must
      # not --build nginx — a reload of the bind-mounted upstreams file is
      # enough. Same idea as the bootstrap image path filter.
      nginx: ${{ steps.filter.outputs.nginx == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            api:
              - 'apps/api/**'
              - 'apps/aggregator-bootstrap/**'
              - 'nginx/**'
              - 'docker-compose*.yml'
              - 'scripts/cutover-backend.sh'
              - 'scripts/deploy.sh'
              - '.github/workflows/deploy.yml'
            bootstrap:
              - 'apps/aggregator-bootstrap/Dockerfile'
              - 'apps/aggregator-bootstrap/docker-entrypoint.sh'
              - 'apps/aggregator-bootstrap/pyproject.toml'
              - 'apps/aggregator-bootstrap/uv.lock'
              - 'apps/aggregator-bootstrap/src/**'
            nginx:
              - 'nginx/**'

  # ── Test & deploy ────────────────────────────────────────────────────────────
  #
  # Web/admin keep lint and test as steps on the same runner as the Vercel
  # build. Splitting those gated the deploy serially and paid ~65s to boot a
  # second machine that then installed pnpm again. API is different: pytest
  # and docker build are 90s+60s of independent work, so they are sibling
  # jobs and the VM deploy waits for both.

  deploy-web:
    name: Test & Deploy Web to Vercel
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-web-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm --filter web test

      - name: Type-check
        run: pnpm --filter web exec tsc --noEmit

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        # `--archive=tgz` uploads one tarball instead of one request per file.
        # Without it a Next build's several thousand static assets are several
        # thousand uploads, and the free plan caps those at 5000 per 24 hours
        # across the whole account — so two apps and a few redeploys in one day
        # is enough to hit it. It fails as `api-upload-free` *after* a
        # successful build, which reads like a broken deploy rather than a
        # quota, and blocks every further deploy for a day.
        #
        # Retried because that tarball is a single ~30MB request over the open
        # internet, and it does fail: the web app's upload died as a bare
        # `fetch failed` 7.3MB into 29.2MB, on the same command that had
        # succeeded for admin two minutes earlier and for web twenty minutes
        # before that. Nothing was wrong — the build was already done and paid
        # for, and it was thrown away for a dropped connection. Retrying is
        # safe: a deployment only goes live once its upload completes, so a
        # half-sent archive promotes nothing.
        run: |
          for attempt in 1 2 3; do
            if npx vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}; then
              exit 0
            fi
            echo "::warning::vercel deploy attempt ${attempt} of 3 failed"
            sleep $((attempt * 10))
          done
          echo "::error::vercel deploy failed three times"
          exit 1

  deploy-admin:
    name: Test & Deploy Admin to Vercel
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/admin/.next/cache
          key: nextjs-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/admin/**/*.ts', 'apps/admin/**/*.tsx') }}
          restore-keys: |
            nextjs-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-admin-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter admin lint

      - name: Test
        run: pnpm --filter admin test

      - name: Type-check
        run: pnpm --filter admin exec tsc --noEmit

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        # `--archive=tgz` uploads one tarball instead of one request per file.
        # Without it a Next build's several thousand static assets are several
        # thousand uploads, and the free plan caps those at 5000 per 24 hours
        # across the whole account — so two apps and a few redeploys in one day
        # is enough to hit it. It fails as `api-upload-free` *after* a
        # successful build, which reads like a broken deploy rather than a
        # quota, and blocks every further deploy for a day.
        #
        # Retried because that tarball is a single ~30MB request over the open
        # internet, and it does fail: the web app's upload died as a bare
        # `fetch failed` 7.3MB into 29.2MB, on the same command that had
        # succeeded for admin two minutes earlier and for web twenty minutes
        # before that. Nothing was wrong — the build was already done and paid
        # for, and it was thrown away for a dropped connection. Retrying is
        # safe: a deployment only goes live once its upload completes, so a
        # half-sent archive promotes nothing.
        run: |
          for attempt in 1 2 3; do
            if npx vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}; then
              exit 0
            fi
            echo "::warning::vercel deploy attempt ${attempt} of 3 failed"
            sleep $((attempt * 10))
          done
          echo "::error::vercel deploy failed three times"
          exit 1

  # Test, image build, and (when needed) the Playwright bootstrap build run as
  # three jobs so wall clock is max(test, build) instead of test+build+bootstrap.
  # :latest is NOT pushed here — a red suite must not retag production. The
  # deploy job promotes the SHA tag after tests pass.
  #
  # Web/admin keep lint+test as steps on the same runner: splitting those
  # paid ~65s to boot a second machine that then installed pnpm again. API
  # docker build is 60–100s of work that does not need the test database, so
  # the split is worth a runner.

  test-api:
    name: Test API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A real database, because the bugs that reached production were a lazy
    # load in async context and a stale read after commit. Neither is visible
    # without a live session and a round trip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mm
          POSTGRES_PASSWORD: mm
          POSTGRES_DB: mm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mm:mm@localhost:5432/mm_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `pip install -e ".[dev]"` took 19s of this job's 97s. uv resolves and
      # installs the same set in a couple of seconds, and caches the wheels
      # itself — so `cache: pip` on setup-python above is no longer needed.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/pyproject.toml

      - name: Cache ruff
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('apps/api/pyproject.toml') }}

      - name: Cache pytest
        uses: actions/cache@v4
        with:
          path: apps/api/.pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: pytest-${{ runner.os }}-

      - name: Install dependencies
        run: |
          cd apps/api
          uv pip install --system -e ".[dev]"

      - name: Ruff check
        run: |
          cd apps/api
          ruff check .
        env:
          RUFF_CACHE_DIR: ~/.cache/ruff

      - name: Ruff format check
        run: |
          cd apps/api
          ruff format --check .
        env:
          RUFF_CACHE_DIR: ~/.cache/ruff

      - name: Prepare the test database
        run: |
          cd apps/api
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      # Deliberately serial. `-n auto --dist loadfile` was tried here and
      # measured 50s against 47s for the serial run — slightly *worse*. The
      # suite is ~1280 fast tests whose CI cost is importing the app, not
      # running them, and every xdist worker pays that import separately. It
      # does help on a developer machine with more cores (9.6s -> 5.6s), which
      # is why the dependency is still there.
      #
      # Coverage stays on pr-check.yml. `--cov` on every deploy added ~20–30s
      # for a report nobody reads off the production pipeline.
      - name: Run pytest
        run: |
          cd apps/api
          pytest tests/ --tb=short

  build-api:
    name: Build API image
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA tag only. Promoting :latest before tests pass would leave a failing
      # commit as what the VM pulls on the next `docker pull :latest`.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/mm-ecommerce-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-bootstrap:
    name: Build aggregator-bootstrap image
    needs: changes
    if: needs.changes.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aggregator-bootstrap image
        uses: docker/build-push-action@v6
        with:
          context: apps/aggregator-bootstrap
          file: apps/aggregator-bootstrap/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/mm-ecommerce-aggregator-bootstrap:${{ github.sha }}
          cache-from: type=gha,scope=bootstrap
          cache-to: type=gha,mode=max,scope=bootstrap

  deploy-gcp:
    name: Deploy API to GCP
    needs: [changes, test-api, build-api, build-bootstrap]
    # `always()` so a skipped build-bootstrap (routine API deploy) does not
    # skip this job. The result checks still refuse to ship a red suite.
    if: >
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      needs.test-api.result == 'success' &&
      needs.build-api.result == 'success' &&
      (needs.build-bootstrap.result == 'success' || needs.build-bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote API image to :latest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/mm-ecommerce-api:latest \
            ghcr.io/${{ github.repository_owner }}/mm-ecommerce-api:${{ github.sha }}

      - name: Promote aggregator-bootstrap image to :latest
        if: needs.changes.outputs.bootstrap == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/mm-ecommerce-aggregator-bootstrap:latest \
            ghcr.io/${{ github.repository_owner }}/mm-ecommerce-aggregator-bootstrap:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write .env on VM
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cat > /opt/melting-moments-cakes/.env" <<'ENVEOF'
          APP_ENV=${{ secrets.APP_ENV }}
          USE_SSL=${{ secrets.USE_SSL }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_POOL_SIZE=${{ secrets.DATABASE_POOL_SIZE || '5' }}
          DATABASE_MAX_OVERFLOW=${{ secrets.DATABASE_MAX_OVERFLOW || '8' }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
          PASSWORD_RESET_EXPIRE_MINUTES=${{ secrets.PASSWORD_RESET_EXPIRE_MINUTES }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ZIINA_ENABLED=${{ secrets.ZIINA_ENABLED }}
          ZIINA_API_KEY=${{ secrets.ZIINA_API_KEY }}
          ZIINA_WEBHOOK_SECRET=${{ secrets.ZIINA_WEBHOOK_SECRET }}
          ZIINA_API_URL=${{ secrets.ZIINA_API_URL }}
          ZIINA_TEST_MODE=${{ secrets.ZIINA_TEST_MODE }}
          ZIINA_TIMEOUT_SECONDS=${{ secrets.ZIINA_TIMEOUT_SECONDS }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL=${{ secrets.FROM_EMAIL }}
          GCS_IMAGE_BUCKET=${{ secrets.GCS_IMAGE_BUCKET || 'mm-product-images' }}
          GCS_INVOICE_BUCKET=${{ secrets.GCS_INVOICE_BUCKET || 'melting-moments-data' }}
          TABBY_API_KEY=${{ secrets.TABBY_API_KEY }}
          TABBY_PUBLIC_KEY=${{ secrets.TABBY_PUBLIC_KEY }}
          TABBY_MERCHANT_CODE=${{ secrets.TABBY_MERCHANT_CODE }}
          TAMARA_API_KEY=${{ secrets.TAMARA_API_KEY }}
          TAMARA_API_URL=${{ secrets.TAMARA_API_URL }}
          LALAMOVE_API_KEY=${{ secrets.LALAMOVE_API_KEY }}
          LALAMOVE_API_SECRET=${{ secrets.LALAMOVE_API_SECRET }}
          LALAMOVE_ENV=${{ secrets.LALAMOVE_ENV || 'production' }}
          LALAMOVE_MARKET=${{ secrets.LALAMOVE_MARKET || 'AE' }}
          LALAMOVE_LANGUAGE=${{ secrets.LALAMOVE_LANGUAGE || 'en_AE' }}
          LALAMOVE_SERVICE_TYPE=${{ secrets.LALAMOVE_SERVICE_TYPE || 'CAR' }}
          LALAMOVE_SPECIAL_REQUESTS=${{ secrets.LALAMOVE_SPECIAL_REQUESTS }}
          LALAMOVE_WEBHOOK_PATH=${{ secrets.LALAMOVE_WEBHOOK_PATH || '/api/v1/webhooks/lalamove' }}
          LALAMOVE_TIMEOUT_SECONDS=${{ secrets.LALAMOVE_TIMEOUT_SECONDS || '8' }}
          LALAMOVE_QUOTE_CACHE_SECONDS=${{ secrets.LALAMOVE_QUOTE_CACHE_SECONDS || '120' }}
          NOON_SEND_API_KEY=${{ secrets.NOON_SEND_API_KEY }}
          NOON_SEND_ENV=${{ secrets.NOON_SEND_ENV || 'production' }}
          NOON_SEND_LOCALE=${{ secrets.NOON_SEND_LOCALE || 'en-ae' }}
          NOON_SEND_CLIENT_CODE=${{ secrets.NOON_SEND_CLIENT_CODE || 'noon_food' }}
          NOON_SEND_MAX_DISTANCE_M=${{ secrets.NOON_SEND_MAX_DISTANCE_M || '20000' }}
          NOON_SEND_DETOUR_FACTOR=${{ secrets.NOON_SEND_DETOUR_FACTOR || '1.49' }}
          NOON_SEND_BASE=${{ secrets.NOON_SEND_BASE || '12' }}
          NOON_SEND_BULKY_BASE=${{ secrets.NOON_SEND_BULKY_BASE || '25' }}
          NOON_SEND_SURGE_AED=${{ secrets.NOON_SEND_SURGE_AED || '1' }}
          APNS_KEY_P8=${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID=${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID=${{ secrets.APNS_TEAM_ID }}
          APNS_ORDER_SOUND=${{ secrets.APNS_ORDER_SOUND || 'new-order.caf' }}
          APNS_TIMEOUT_SECONDS=${{ secrets.APNS_TIMEOUT_SECONDS || '10' }}
          NOON_SEND_WEBHOOK_API_KEY=${{ secrets.NOON_SEND_WEBHOOK_API_KEY }}
          NOON_SEND_ENFORCE_WEBHOOK_KEY=${{ secrets.NOON_SEND_ENFORCE_WEBHOOK_KEY || 'false' }}
          NOON_SEND_TIMEOUT_SECONDS=${{ secrets.NOON_SEND_TIMEOUT_SECONDS || '8' }}
          GRUBOPS_SYNC_ENABLED=${{ secrets.GRUBOPS_SYNC_ENABLED || 'false' }}
          GRUBOPS_USERNAME=${{ secrets.GRUBOPS_USERNAME }}
          GRUBOPS_PASSWORD=${{ secrets.GRUBOPS_PASSWORD }}
          GRUBOPS_PARTNER_ID=${{ secrets.GRUBOPS_PARTNER_ID || '6922fe267f5b1c6d208c634f' }}
          GRUBOPS_COGNITO_CLIENT_ID=${{ secrets.GRUBOPS_COGNITO_CLIENT_ID || '75n3em3l16kvhnf6c512680vm9' }}
          GRUBOPS_COGNITO_REGION=${{ secrets.GRUBOPS_COGNITO_REGION || 'eu-west-2' }}
          GRUBOPS_API_BASE=${{ secrets.GRUBOPS_API_BASE || 'https://internal-api.grubtech.io' }}
          GRUBOPS_CATALOG_API_BASE=${{ secrets.GRUBOPS_CATALOG_API_BASE || 'https://api-grubone.grubtech.io' }}
          GRUBOPS_SOURCE=${{ secrets.GRUBOPS_SOURCE || 'grubOps 2.0' }}
          GRUBOPS_TIMEOUT_SECONDS=${{ secrets.GRUBOPS_TIMEOUT_SECONDS || '8' }}
          GRUBOPS_RECONCILE_TICK_SECONDS=${{ secrets.GRUBOPS_RECONCILE_TICK_SECONDS || '120' }}
          GRUBOPS_ORDERS_ENABLED=${{ secrets.GRUBOPS_ORDERS_ENABLED || 'false' }}
          GRUBOPS_ORDERS_API_BASE=${{ secrets.GRUBOPS_ORDERS_API_BASE || 'https://api-grubops.grubtech.io' }}
          GRUBOPS_ORDERS_TICK_SECONDS=${{ secrets.GRUBOPS_ORDERS_TICK_SECONDS || '60' }}
          AGG_AUTO_CLOSE_SECONDS=${{ secrets.AGG_AUTO_CLOSE_SECONDS || '300' }}
          FOODICS_ORDER_PUSH_ENABLED=${{ secrets.FOODICS_ORDER_PUSH_ENABLED || 'false' }}
          FOODICS_CONSOLE_BASE=${{ secrets.FOODICS_CONSOLE_BASE || 'https://console.foodics.com' }}
          FOODICS_ACCOUNT_NUMBER=${{ secrets.FOODICS_ACCOUNT_NUMBER || '862261' }}
          FOODICS_EMAIL=${{ secrets.FOODICS_EMAIL }}
          FOODICS_PASSWORD=${{ secrets.FOODICS_PASSWORD }}
          FOODICS_TIMEOUT_SECONDS=${{ secrets.FOODICS_TIMEOUT_SECONDS || '8' }}
          AGGREGATOR_INGEST_ENABLED=${{ secrets.AGGREGATOR_INGEST_ENABLED || 'true' }}
          AGGREGATOR_CONFIG_ENCRYPTION_KEY=${{ secrets.AGGREGATOR_CONFIG_ENCRYPTION_KEY }}
          AGGREGATOR_SESSION_PUSH_TOKEN=${{ secrets.AGGREGATOR_SESSION_PUSH_TOKEN }}
          AGGREGATOR_RUN_HOUR_DXB=${{ secrets.AGGREGATOR_RUN_HOUR_DXB || '23' }}
          AGGREGATOR_LOOKBACK_DAYS=${{ secrets.AGGREGATOR_LOOKBACK_DAYS || '1' }}
          AGGREGATOR_PROMOTE_LOOKBACK_DAYS=${{ secrets.AGGREGATOR_PROMOTE_LOOKBACK_DAYS || '30' }}
          AGGREGATOR_GRUBOPS_ADOPT_GRACE_HOURS=${{ secrets.AGGREGATOR_GRUBOPS_ADOPT_GRACE_HOURS || '12' }}
          AGGREGATOR_REAUTH_WAIT_SECONDS=${{ secrets.AGGREGATOR_REAUTH_WAIT_SECONDS || '360' }}
          AGGREGATOR_REAUTH_POLL_SECONDS=${{ secrets.AGGREGATOR_REAUTH_POLL_SECONDS || '5.0' }}
          AGGREGATOR_NOON_PUBLICATION_LOOKBACK_DAYS=${{ secrets.AGGREGATOR_NOON_PUBLICATION_LOOKBACK_DAYS || '14' }}
          AGGREGATOR_SALES_REFRESH_MINUTES=${{ secrets.AGGREGATOR_SALES_REFRESH_MINUTES || '60' }}
          AGGREGATOR_SALES_ROLLING_HOURS=${{ secrets.AGGREGATOR_SALES_ROLLING_HOURS || '36' }}
          AGGREGATOR_TIMEOUT_SECONDS=${{ secrets.AGGREGATOR_TIMEOUT_SECONDS || '20.0' }}
          AGGREGATOR_REQUESTS_PER_SECOND=${{ secrets.AGGREGATOR_REQUESTS_PER_SECOND || '1.0' }}
          SLIDER_API_KEY=${{ secrets.SLIDER_API_KEY }}
          SLIDER_ACCOUNT_ID=${{ secrets.SLIDER_ACCOUNT_ID }}
          SLIDER_TIMEOUT_SECONDS=${{ secrets.SLIDER_TIMEOUT_SECONDS || '8' }}
          SLIDER_BIKE_MAX_KM=${{ secrets.SLIDER_BIKE_MAX_KM || '35' }}
          SLIDER_DETOUR_FACTOR=${{ secrets.SLIDER_DETOUR_FACTOR || '1.44' }}
          SLIDER_WEBHOOK_TOKEN=${{ secrets.SLIDER_WEBHOOK_TOKEN }}
          SLIDER_WEBHOOK_HEADER=${{ secrets.SLIDER_WEBHOOK_HEADER || 'X-Slider-Token' }}
          SLIDER_TRIAL_EMAILS=${{ secrets.SLIDER_TRIAL_EMAILS }}
          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_MIN_ROUTE_INTERVAL_S=${{ secrets.MAPBOX_MIN_ROUTE_INTERVAL_S || '60' }}
          MAPBOX_TIMEOUT_S=${{ secrets.MAPBOX_TIMEOUT_S || '5.0' }}
          LOG_RETENTION_DAYS=${{ secrets.LOG_RETENTION_DAYS || '7' }}
          AUDIT_RETENTION_DAYS=${{ secrets.AUDIT_RETENTION_DAYS || '90' }}
          BATCH_DISPATCHER_ENABLED=${{ secrets.BATCH_DISPATCHER_ENABLED || 'true' }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MAX_AUTH_AGE_SECONDS=${{ secrets.FIREBASE_MAX_AUTH_AGE_SECONDS }}
          FIREBASE_TIMEOUT_SECONDS=${{ secrets.FIREBASE_TIMEOUT_SECONDS }}
          PHONE_VERIFICATION_TTL_SECONDS=${{ secrets.PHONE_VERIFICATION_TTL_SECONDS }}
          TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_TIMEOUT_SECONDS=${{ secrets.TURNSTILE_TIMEOUT_SECONDS || '5' }}
          WEB_URL=${{ secrets.WEB_URL }}
          ADMIN_URL=${{ secrets.ADMIN_URL }}
          # Not secrets — the register's hostname is public. Kept apart from
          # ALLOWED_HOSTS so the storefront's host list and the terminal's
          # cannot drift into one another.
          POS_ALLOWED_HOSTS=pos.meltingmomentscakes.com,localhost,127.0.0.1
          POS_CORS_ORIGINS=${{ secrets.POS_CORS_ORIGINS }}
          # The register has its own host and every terminal is on it, so the
          # storefront API no longer honours device tokens. Set only after
          # pos.* was live and its log had gone quiet.
          POS_REQUIRE_POS_HOST=true
          BACKUP_GCS_BUCKET=${{ secrets.BACKUP_GCS_BUCKET }}
          UMAMI_API_KEY=${{ secrets.UMAMI_API_KEY }}
          UMAMI_WEBSITE_ID=${{ secrets.UMAMI_WEBSITE_ID }}
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT=production
          SENTRY_TRACES_SAMPLE_RATE=0.02
          ENVEOF

      - name: Deploy to GCP VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "BOOTSTRAP_CHANGED='${{ needs.changes.outputs.bootstrap }}' NGINX_CHANGED='${{ needs.changes.outputs.nginx }}' stdbuf -oL -eL bash -s" <<'SCRIPT'
          set -eo pipefail

          cd /opt/melting-moments-cakes

          echo "Pulling latest code (compose files, nginx config, etc.)..."
          git fetch origin main
          git reset --hard origin/main

          # git reset restores the committed nginx/runtime/upstreams.conf, which
          # always points at slot A. After a green cutover that would send the
          # next nginx reload (or a rebuild below) at a stopped container.
          echo "Restoring live nginx upstreams from .deploy-slot..."
          bash scripts/cutover-backend.sh restore-upstreams < /dev/null

          # Reclaim superseded images BEFORE pulling, not after. The old cleanup
          # ran only at the end of a successful deploy, so a deploy that filled
          # the disk while pulling (or a dozen deploys in one day, faster than
          # the old 12h age filter would release anything) had no space freed
          # first — which is exactly how the 20GB disk hit 100% and the
          # pre-migration backup failed. Dangling-only (`-f`, no `-a`): a pull
          # retags :latest and orphans the previous image, so this removes every
          # superseded layer while keeping each in-use :latest — including the
          # bootstrap image, which no running container references (it is run
          # one-shot) and `-a` would therefore wrongly delete. Steady state is
          # the live images plus, briefly mid-deploy, the one they just replaced.
          echo "Reclaiming superseded images before pulling..."
          docker image prune -f < /dev/null || true

          echo "Pulling pre-built API image from GHCR..."
          docker pull ghcr.io/hussu97/mm-ecommerce-api:latest

          # The ~4.7GB Playwright bootstrap image is pulled + the worker restarted
          # further down, and ONLY when its sources changed (see "aggregator worker
          # daemon"). It is not on the API request path, so it must not slow a
          # routine API deploy — that is why the pull is gated on BOOTSTRAP_CHANGED
          # there rather than pulled inline here.
          if [ "$BOOTSTRAP_CHANGED" = "true" ]; then
            echo "Bootstrap image changed — the worker step below will pull + restart it."
          else
            echo "Bootstrap sources unchanged — worker keeps its current image."
          fi

          # A migration can drop a table, and `alembic downgrade` cannot bring
          # the rows back — only the empty shape. Until 2026-08-06 this job ran
          # migrations against the live database with nothing taken first, so
          # the only thing standing between a bad migration and the order
          # history was the migration being right.
          #
          # `scripts/backup-db.sh` already existed and was only ever run by
          # hand. It is cheap (a gzipped pg_dump), it keeps 7 days locally and
          # copies to GCS when BACKUP_GCS_BUCKET is set, and it is the
          # difference between a mistake being an inconvenience and being
          # unrecoverable. A failure here stops the deploy: migrating without
          # one is the situation this exists to prevent.
          echo "Backing up the database before migrating..."
          timeout 600 bash scripts/backup-db.sh < /dev/null \
            || { echo "ERROR: Pre-migration backup failed — refusing to migrate"; exit 1; }

          echo "Running database migrations..."
          # Use < /dev/null to prevent stdin hijacking
          timeout 300 docker compose -f docker-compose.prod.yml run --rm --no-deps -T api alembic upgrade head < /dev/null \
            || { echo "ERROR: Migration failed or timed out after 5 minutes"; exit 1; }

          # A migration writes straight to Postgres, so every key the API is
          # holding for it keeps serving the pre-migration copy. That is
          # invisible on a normal deploy and ugly on a content one: the Vercel
          # build runs in parallel and bakes whatever the API answers with into
          # the static pages, per locale, so a page can ship half migrated.
          #
          # This list is **every read-through cache prefix the API writes**, not
          # the ones a particular migration was known to touch. It was built one
          # prefix at a time and that is exactly how it kept being wrong:
          # `cms:*` alone, then `categories:*` and `products:*` when migration
          # 120 renamed the category slugs, then `i18n:*` when 121 edited the
          # promo banner and the old text stayed up for five minutes after a
          # green deploy. Adding the prefix you just got caught by leaves the
          # next one to be discovered in production.
          #
          # `analytics:*` is deliberately absent: it is derived from `orders`,
          # nothing in `alembic/` writes it, and dropping it only makes the next
          # dashboard load slow for no reason.
          #
          # A whole-database FLUSHDB is not the shortcut it looks like — this
          # Redis also holds rate-limiter state and idempotency keys, and losing
          # those mid-deploy is worse than a stale page.
          echo "Invalidating read-through caches..."
          docker compose -f docker-compose.prod.yml exec -T redis \
            sh -c 'for p in "cms:*" "i18n:*" "categories:*" "products:*" "blog:*" "redirects:*"; do redis-cli --scan --pattern "$p" | xargs -r redis-cli del; done' < /dev/null \
            || echo "WARNING: cache flush failed — content may be stale for up to 5 minutes"

          # Retire the host-cron aggregator model: scheduling is now in-process in
          # the always-on worker daemon (Phase 3, daemon.py), so drop the
          # /etc/cron.d file. The worker itself is (re)started AFTER cutover below —
          # cutover stops it to free RAM for the green API slot, and with
          # `restart: unless-stopped` a stop stays stopped until an explicit `up -d`.
          echo "Removing the retired aggregator warm cron (scheduling is now in-process)..."
          if sudo -n true 2>/dev/null; then
            sudo rm -f /etc/cron.d/aggregator-warm || true
          else
            rm -f /etc/cron.d/aggregator-warm 2>/dev/null || true
          fi

          # Every docker command here needs `< /dev/null`. This whole script is
          # piped into `bash -s`, and docker reads stdin, so a command without
          # it swallows the rest of the script. That is not hypothetical: the
          # nginx reload below had no guard, so for months every deploy ended
          # silently at this point — "Deployment complete" has never once been
          # printed — while the job still reported success.
          # Rebuild nginx only when nginx/ changed: its config and entrypoint
          # are baked into the image, so --build is required for those, but a
          # rebuild drops TLS while the container is replaced. API-only deploys
          # retarget the bind-mounted upstreams file and reload. Do this BEFORE
          # cutover so the new image already includes the runtime include, and
          # so the first deploy of that include cannot reload an old nginx that
          # still has `server api:8000` baked in and then stop `api`.
          if [ "$NGINX_CHANGED" = "true" ]; then
            echo "nginx/ changed — rebuilding nginx (TLS will blip)..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --build nginx < /dev/null
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload < /dev/null
          else
            echo "nginx/ unchanged — skipping rebuild; cutover will reload upstreams."
          fi

          echo "Cutting over API then POS onto the new image (idle slot, nginx reload, drain)..."
          bash scripts/cutover-backend.sh < /dev/null

          # (Re)start the always-on aggregator worker daemon AFTER cutover — cutover
          # stops it to free RAM for the green API slot, and `restart:
          # unless-stopped` keeps a stopped container stopped until this explicit
          # `up -d`. The ~4.7 GB bootstrap image is pulled ONLY when its sources
          # changed: this explicit pull is the fix for the old `pull_policy: missing`
          # bug where a rebuilt :latest was never fetched to the VM, so worker code
          # changes silently never deployed. `up -d` then recreates the container on
          # the new image (and starts it whether it was stopped by cutover or never
          # existed on this VM before).
          if [ "$BOOTSTRAP_CHANGED" = "true" ]; then
            echo "Pulling the rebuilt aggregator-bootstrap image..."
            docker compose -f docker-compose.prod.yml pull aggregator-worker < /dev/null \
              || echo "WARNING: could not pull aggregator-bootstrap image"
          fi
          echo "Starting the aggregator worker daemon..."
          docker compose -f docker-compose.prod.yml up -d aggregator-worker < /dev/null \
            || echo "WARNING: could not start aggregator-worker"

          # The deploy only ever started api and nginx, so when the certbot
          # renewal loop died it stayed dead through every subsequent deploy
          # and the certificate silently expired. Bring it up here too.
          echo "Ensuring the certificate renewal loop is up..."
          docker compose -f docker-compose.prod.yml up -d --no-deps certbot < /dev/null

          # Run this in the certbot image, not nginx: nginx:alpine ships no
          # openssl, so the check there reported no dates and warned on every
          # certificate unconditionally — noise that would soon be ignored.
          echo "Certificate expiry:"
          # Host openssl on the bind-mounted certs — `compose run certbot`
          # started a container every deploy for a 15s date print.
          if command -v openssl >/dev/null 2>&1; then
            for c in certbot/conf/live/*/cert.pem; do
              [ -e "$c" ] || continue
              echo "  $(basename "$(dirname "$c")"): $(openssl x509 -enddate -noout -in "$c" | cut -d= -f2)"
              openssl x509 -checkend 604800 -noout -in "$c" > /dev/null \
                || echo "    WARNING: expires within 7 days"
            done
          else
            echo "  skipped: no openssl on host"
          fi

          # A second dangling sweep after the restart: the image the containers
          # were running at the start of this deploy lost its :latest tag when
          # the new one was pulled, and is now free (nothing runs it anymore).
          # No age filter — the pre-pull sweep above explains why `until=12h`
          # was the bug (it kept every image younger than the deploy cadence)
          # and why dangling-only is what "keep just the live image" means here:
          # a rollback re-pulls its SHA from GHCR (`rollback.yml`) rather than
          # reading any local copy, so nothing is lost by not hoarding old tags.
          echo "Pruning superseded images..."
          docker image prune -f < /dev/null

          # nginx is built on the VM when nginx/ changes (--build above) and
          # its cache is never reclaimed otherwise — it had grown to 3.2GB.
          if [ "$NGINX_CHANGED" = "true" ]; then
            echo "Pruning stale build cache..."
            docker builder prune -f < /dev/null
          fi

          # journald shipped uncapped (default: 10% of the disk = 2GB here) and
          # had reached 810MB. Cap it so logs cannot crowd out the DB. Guarded
          # and non-fatal: a logging tweak must never fail a deploy. Skip the
          # restart once the drop-in exists — restarting journald every
          # deploy was a few seconds of gap for no change.
          echo "Capping systemd journal size..."
          if sudo -n true < /dev/null 2>/dev/null; then
            if [ ! -f /etc/systemd/journald.conf.d/99-size-cap.conf ]; then
              sudo -n mkdir -p /etc/systemd/journald.conf.d < /dev/null
              printf '[Journal]\nSystemMaxUse=200M\nSystemMaxFileSize=50M\n' \
                | sudo -n tee /etc/systemd/journald.conf.d/99-size-cap.conf > /dev/null
              sudo -n systemctl restart systemd-journald < /dev/null
              sudo -n journalctl --vacuum-size=200M < /dev/null 2>&1 | tail -1
            else
              echo "  already capped"
            fi
          else
            echo "  skipped: no passwordless sudo for $(whoami)"
          fi

          echo "Disk after cleanup:"
          df -h / < /dev/null | tail -1

          echo "Deployment complete."
          docker compose -f docker-compose.prod.yml ps < /dev/null
          SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
