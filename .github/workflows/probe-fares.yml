name: Probe courier fares

# Manual only. Runs the minimal Slider fare probe INSIDE the live api container
# on the VM (the only egress Slider's prod fare API answers) for ONE branch —
# fares are origin-specific — then uploads the refreshed
# courier_costs.<REF>.json as an artifact. Nothing is committed or deployed —
# download the artifact, drop it into apps/api/app/data/courier_costs.<REF>.json,
# rebuild the map with scripts/build_delivery_areas.py, and ship it as a new
# polygon version. See scripts/probe_courier_fares.py.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose pin is the pickup origin
        type: choice
        options: [K001, B001]
        default: K001
      probe_all:
        description: Re-probe every area (default only fills areas missing a fare)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run the Slider fare probe in the live api container
        env:
          HOST: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
          REF: ${{ inputs.branch }}
          PROBE_ALL: ${{ inputs.probe_all && '1' || '0' }}
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/deploy_key"
          SSH="ssh -i $KEY -o ConnectTimeout=30 $HOST"

          # A fresh, user-owned staging dir on the VM, so nothing collides with a
          # root-owned leftover in /tmp.
          STAGE="$($SSH "mktemp -d")"
          echo "stage: $STAGE"

          # The script and the area/cost data ride in from this checkout, not the
          # deployed image, so the probe surveys exactly the areas on this ref
          # (new points included) and keeps this ref's committed fares. Mutating
          # the container's copies is harmless: the running app serves its map
          # from the database, not these files.
          scp -i "$KEY" apps/api/scripts/probe_courier_fares.py "$HOST:$STAGE/probe.py"
          scp -i "$KEY" apps/api/app/data/uae_delivery_areas.json "$HOST:$STAGE/areas.json"
          # The script reads and writes the per-branch file (courier_costs.<REF>.json);
          # the legacy courier_costs.json is the Sharjah survey build_delivery_areas reads.
          scp -i "$KEY" "apps/api/app/data/courier_costs.$REF.json" "$HOST:$STAGE/costs.json"

          # The live api slot (api-1 or api-green-1 — 'cakes-api' adjacency
          # excludes pos-api). Only the running one shows in `docker ps`.
          SLOT="$($SSH "docker ps --format '{{.Names}}' | grep -E 'melting-moments-cakes-api(-green)?-1' | head -1")"
          echo "live api slot: ${SLOT:-<none>}"
          test -n "$SLOT"

          $SSH "docker cp $STAGE/probe.py $SLOT:/app/scripts/probe_courier_fares.py"
          $SSH "docker cp $STAGE/areas.json $SLOT:/app/app/data/uae_delivery_areas.json"
          $SSH "docker cp $STAGE/costs.json $SLOT:/app/app/data/courier_costs.$REF.json"
          $SSH "docker exec -w /app -e PROBE_ALL=$PROBE_ALL $SLOT sh -lc 'PYTHONPATH=/app python -u scripts/probe_courier_fares.py --branch $REF'"
          $SSH "docker cp $SLOT:/tmp/courier_costs.$REF.json $STAGE/out.json"
          $SSH "cat $STAGE/out.json" > "courier_costs.$REF.json"
          $SSH "rm -rf $STAGE" || true
          echo "wrote $(wc -c < "courier_costs.$REF.json") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: courier_costs.${{ inputs.branch }}
          path: courier_costs.${{ inputs.branch }}.json
          retention-days: 7
